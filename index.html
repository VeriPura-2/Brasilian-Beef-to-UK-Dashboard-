<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeriPura — Brazil to GB Frozen Beef Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#1c1a14;--paper:#f7f4ec;--card:#ffffff;--gold:#5c4110;--gold-dim:#c49a2a;
  --green:#0f4a32;--green-lt:#e4f2ea;
  --amber:#6b430a;--amber-lt:#faf0dc;
  --red:#7f2416;--red-lt:#fbebe6;
  --blue:#134266;--blue-lt:#e8f1f8;
  --mid:#2c2818;--border:#d9d2bd;--surface:#efe9db;
}
body{font-family:'Instrument Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
.mono{font-family:'DM Mono',monospace;}
.serif{font-family:'DM Serif Display',serif;}
header{
  position:sticky;top:0;z-index:100;background:rgba(247,244,236,0.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:0.9rem 1.75rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:0.75rem;}
.brand-word{font-family:'DM Serif Display',serif;font-size:1.383rem;}
.brand-word span{color:var(--gold);}
.brand-tag{font-family:'DM Mono',monospace;font-size:0.733rem;font-weight:500;color:var(--mid);letter-spacing:0.08em;text-transform:uppercase;border-left:1px solid var(--border);padding-left:0.75rem;}
.hdr-right{display:flex;align-items:center;gap:0.75rem;}
select#role-select{
  font-family:'DM Mono',monospace;font-size:0.843rem;font-weight:500;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:0.5rem 0.75rem;color:var(--ink);cursor:pointer;min-width:260px;
}
.admin-pill{font-family:'DM Mono',monospace;font-size:0.683rem;background:var(--ink);color:var(--paper);padding:0.3rem 0.6rem;border-radius:20px;letter-spacing:0.05em;}
.bell-wrap{position:relative;}
.bell-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:1.083rem;position:relative;}
.bell-dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--blue);}
.bell-dot.flash{animation:bellFlash 1.1s ease;}
@keyframes bellFlash{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(163,49,31,0);}
  25%{transform:scale(2.6);box-shadow:0 0 0 6px rgba(163,49,31,0.35);}
  55%{transform:scale(1);box-shadow:0 0 0 0 rgba(163,49,31,0);}
  75%{transform:scale(2.2);box-shadow:0 0 0 4px rgba(163,49,31,0.25);}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(163,49,31,0);}
}
.bell-panel{
  position:absolute;top:44px;right:0;width:320px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,0.12);padding:0.5rem;display:none;z-index:200;
}
.bell-panel.open{display:block;}
.bell-item{padding:0.6rem 0.6rem;border-bottom:1px solid var(--border);font-size:0.903rem;font-weight:500;color:var(--ink);cursor:pointer;transition:background 0.15s;}
.bell-item:hover{background:var(--surface);}
.bell-item:last-child{border-bottom:none;}
.bell-sev{font-family:'DM Mono',monospace;font-size:0.633rem;padding:0.1rem 0.4rem;border-radius:4px;margin-right:0.4rem;}
.sev-info{background:var(--blue-lt);color:var(--blue);}
.sev-warn{background:var(--amber-lt);color:var(--amber);}
.sev-crit{background:var(--red-lt);color:var(--red);}
main{max-width:1180px;margin:0 auto;padding:1.75rem;}
.role-banner{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.85rem 1.1rem;
  margin-bottom:1.25rem;font-size:0.943rem;font-weight:500;color:var(--mid);display:flex;align-items:center;gap:0.6rem;
}
.role-banner b{color:var(--ink);font-weight:600;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.5rem;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;}
.kpi-label{font-family:'DM Mono',monospace;font-size:0.713rem;font-weight:500;color:var(--mid);letter-spacing:0.06em;text-transform:uppercase;}
.kpi-val{font-family:'DM Serif Display',serif;font-size:1.783rem;margin-top:0.2rem;}
h2.section{font-family:'DM Serif Display',serif;font-size:1.233rem;font-weight:400;margin:1.75rem 0 0.75rem;}
.card-list{display:flex;flex-direction:column;gap:10px;}
.item{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.15rem;
  cursor:pointer;transition:border-color 0.15s;
}
.item:hover{border-color:var(--gold);}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;}
.item-title{font-size:1.033rem;font-weight:600;}
.item-sub{font-family:'DM Mono',monospace;font-size:0.813rem;font-weight:500;color:var(--mid);margin-top:0.25rem;}
.badge{font-family:'DM Mono',monospace;font-size:0.743rem;font-weight:500;padding:0.25rem 0.6rem;border-radius:20px;white-space:nowrap;}
.b-green{background:var(--green-lt);color:var(--green);}
.b-amber{background:var(--amber-lt);color:var(--amber);}
.b-red{background:var(--red-lt);color:var(--red);}
.b-blue{background:var(--blue-lt);color:var(--blue);}
.b-gray{background:var(--surface);color:var(--mid);}
.lifecycle{display:flex;align-items:center;gap:4px;margin-top:0.75rem;}
.lc-step{flex:1;text-align:center;}
.lc-dot{width:9px;height:9px;border-radius:50%;background:var(--border);display:inline-block;}
.lc-dot.done{background:var(--green);}
.lc-dot.now{background:var(--gold);}
.lc-label{font-size:0.723rem;font-weight:500;color:var(--mid);margin-top:3px;display:block;}
.lc-line{flex:1;height:1px;background:var(--border);}
.item-note{font-size:0.833rem;font-weight:500;color:var(--mid);margin-top:0.5rem;}
.overlay{position:fixed;inset:0;background:rgba(28,26,20,0.35);z-index:900;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.overlay.open{opacity:1;pointer-events:all;}
.passport{
  position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;background:var(--paper);
  border-left:1px solid var(--border);z-index:901;transform:translateX(100%);
  transition:transform 0.3s ease;overflow-y:auto;padding:1.5rem;
}
.passport.open{transform:translateX(0);}
.p-close{float:right;background:none;border:1px solid var(--border);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:0.983rem;}
.p-ref{font-family:'DM Mono',monospace;font-size:0.803rem;font-weight:500;color:var(--gold);letter-spacing:0.06em;}
.p-title{font-family:'DM Serif Display',serif;font-size:1.483rem;margin:0.2rem 0 0.3rem;}
.p-route{font-size:0.943rem;font-weight:500;color:var(--mid);}
.p-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:0.85rem;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin:1rem 0;}
.p-meta div span{display:block;}
.p-meta .l{font-size:0.733rem;font-weight:500;color:var(--mid);text-transform:uppercase;letter-spacing:0.05em;font-family:'DM Mono',monospace;}
.p-meta .v{font-size:0.963rem;font-weight:500;margin-top:0.15rem;}
.p-doc{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.7rem 0.9rem;margin-bottom:6px;}
.p-doc-name{font-size:0.943rem;font-weight:600;color:var(--ink);}
.p-doc-sub{font-size:0.803rem;font-weight:500;color:var(--mid);margin-top:3px;}
.p-doc-source{display:block;font-family:'DM Mono',monospace;font-size:0.7rem;font-weight:500;color:var(--gold);margin-top:3px;text-transform:uppercase;letter-spacing:0.03em;}
.p-doc-right{display:flex;align-items:center;gap:0.7rem;}
.p-doc-link{font-family:'DM Mono',monospace;font-size:0.803rem;font-weight:600;color:var(--blue);text-decoration:none;cursor:pointer;}
.p-hash{font-family:'DM Mono',monospace;font-size:0.743rem;font-weight:500;color:var(--mid);margin-top:0.1rem;}
.p-note{font-size:0.843rem;font-weight:500;color:var(--mid);margin-top:1rem;padding-top:0.85rem;border-top:1px solid var(--border);}
.p-actions{display:flex;gap:0.5rem;margin-top:1rem;}
.p-btn{font-family:'DM Mono',monospace;font-size:0.803rem;font-weight:500;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:0.5rem 0.85rem;cursor:pointer;color:var(--ink);}
.p-btn:hover{border-color:var(--gold);}
.p-btn.done{background:var(--green-lt);color:var(--green);border-color:var(--green);}
.timeline{margin-top:0.5rem;}
.tl-row{font-size:0.883rem;font-weight:500;color:var(--mid);padding:0.45rem 0;border-bottom:1px solid var(--border);}
.tl-row b{color:var(--ink);font-weight:600;}
.route-strip{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem;}
.route-lane{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.7rem 1rem;display:flex;align-items:center;gap:0.75rem;}
.route-lane .rl-ports{font-size:0.903rem;font-weight:500;flex:1;}
.route-lane .rl-count{font-family:'DM Mono',monospace;font-size:0.763rem;color:var(--mid);font-weight:500;}
.rl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
#passport-map{width:100%;height:150px;border-radius:8px;margin:0.75rem 0;}
#tracking-map-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.5rem;margin-bottom:1.25rem;}
#tracking-map{width:100%;height:380px;border-radius:8px;}
.tip-id{color:var(--gold);font-weight:600;margin-right:6px;}
.fullview{position:fixed;inset:0;z-index:1000;background:var(--paper);display:none;overflow-y:auto;}
.fullview.open{display:block;}
.fv-header{position:sticky;top:0;background:rgba(247,244,236,0.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:1rem 1.75rem;display:flex;align-items:center;gap:1rem;}
.fv-back{font-family:'DM Mono',monospace;font-size:0.83rem;font-weight:500;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:0.5rem 1rem;cursor:pointer;display:inline-flex;align-items:center;gap:0.4rem;}
.fv-back:hover{border-color:var(--gold-dim);}
.fv-body{max-width:900px;margin:0 auto;padding:1.75rem;}
.fv-priority-tag{font-family:'DM Mono',monospace;font-size:0.66rem;font-weight:600;color:var(--red);background:var(--red-lt);border-radius:4px;padding:0.15rem 0.5rem;margin-left:0.5rem;}
.leaflet-container{background:#eae4d4 !important;font-family:'Instrument Sans',sans-serif;}
.leaflet-popup-content-wrapper{border-radius:8px !important;box-shadow:0 8px 24px rgba(0,0,0,0.15) !important;}
.leaflet-popup-content{font-family:'DM Mono',monospace;font-size:0.783rem;margin:0.6rem 0.8rem !important;}
.map-pop-id{color:var(--gold);font-size:0.703rem;margin-bottom:2px;}
.map-pop-name{font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:0.883rem;color:var(--ink);}
.map-pop-link{color:var(--blue);cursor:pointer;font-size:0.703rem;display:block;margin-top:4px;}
.port-dot{width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--border);}
.route-dot{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.35);cursor:pointer;}
.new-po-btn{font-family:'DM Mono',monospace;font-size:0.803rem;font-weight:500;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:0.6rem 1rem;cursor:pointer;margin-bottom:1.1rem;}
.new-po-btn:hover{background:#33301f;}
.status-filter-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:1.1rem;flex-wrap:wrap;}
.sf-btn{font-family:'Instrument Sans',sans-serif;font-size:0.83rem;font-weight:500;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:0.4rem 0.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:0.4rem;color:var(--ink);}
.sf-btn:hover{border-color:var(--gold-dim);}
.sf-btn.active{border:2px solid var(--gold-dim);background:var(--amber-lt);}
.sf-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.po-modal{position:fixed;inset:0;z-index:950;display:none;align-items:center;justify-content:center;background:rgba(28,26,20,0.35);}
.po-modal.open{display:flex;}
.po-modal-inner{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:1.5rem;width:500px;max-width:92vw;max-height:85vh;overflow-y:auto;}
.po-field{margin-bottom:0.9rem;}
.po-field label{display:block;font-family:'DM Mono',monospace;font-size:0.733rem;font-weight:500;color:var(--mid);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.3rem;}
.po-field input,.po-field select{width:100%;font-family:'Instrument Sans',sans-serif;font-size:0.933rem;padding:0.55rem 0.7rem;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);}
.po-actions{display:flex;justify-content:flex-end;gap:0.5rem;margin-top:1.1rem;}
.p-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.item.needs-response{border-color:var(--red);}
.respond-btn{font-family:'DM Mono',monospace;font-size:0.763rem;font-weight:500;background:var(--gold-dim);color:var(--ink);border:none;border-radius:6px;padding:0.45rem 0.85rem;cursor:pointer;margin-top:0.65rem;}
.po-steps{display:flex;gap:6px;margin-bottom:1.1rem;}
.po-step-dot{width:30px;height:4px;border-radius:2px;background:var(--border);}
.po-step-dot.active{background:var(--gold);}
.po-step-dot.done{background:var(--gold-dim);}
.po-tabs{display:flex;gap:0.4rem;margin-bottom:0.9rem;}
.po-tab{flex:1;font-family:'DM Mono',monospace;font-size:0.78rem;font-weight:500;padding:0.55rem 0.6rem;border:1px solid var(--border);background:var(--card);border-radius:8px;cursor:pointer;color:var(--mid);}
.po-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.po-dropzone{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0.3rem;border:1.5px dashed var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem;background:var(--surface);}
.po-dropzone-icon{font-size:1.3rem;color:var(--gold);}
.po-dropzone-input{width:100%;text-align:center;font-family:'DM Mono',monospace;font-size:0.85rem;font-weight:600;border:none;background:transparent;color:var(--ink);}
.po-dropzone-sub{font-size:0.75rem;font-weight:500;color:var(--mid);}
.po-code{font-family:'DM Mono',monospace;font-size:0.73rem;font-weight:500;background:var(--ink);color:#d8d2bb;border-radius:8px;padding:0.7rem 0.8rem;line-height:1.55;overflow-x:auto;margin-bottom:0.4rem;}
.po-req-list{max-height:280px;overflow-y:auto;margin-bottom:0.5rem;}
.po-req-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.55rem 0.8rem;margin-bottom:6px;}
.po-req-source{font-size:0.73rem;font-weight:500;color:var(--mid);margin-top:2px;}
.reg-badge{margin-left:0.4rem;}
.vis-status-note{font-style:italic;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-word">Veri<span>Pura</span></div>
    <div class="brand-tag">Brazil &rarr; GB frozen beef pilot</div>
  </div>
  <div class="hdr-right">
    <span class="admin-pill">SUPERADMIN VIEW</span>
    <select id="role-select" class="mono" onchange="setRole(this.value)"></select>
    <div class="bell-wrap">
      <button class="bell-btn" onclick="toggleBell()">&#128276;<span class="bell-dot" id="bell-dot"></span></button>
      <div class="bell-panel" id="bell-panel"></div>
    </div>
  </div>
</header>
<main>
  <div class="role-banner" id="role-banner"></div>
  <div id="action-row"></div>
  <div class="status-filter-row" id="status-filter-row"></div>
  <div class="route-strip" id="route-strip"></div>
  <div id="tracking-map-wrap" style="display:none;"><div id="tracking-map"></div></div>
  <div class="kpi-row" id="kpi-row"></div>
  <h2 class="section" id="list-title">Consignments</h2>
  <div class="card-list" id="card-list"></div>
</main>

<div class="overlay" id="overlay" onclick="closePassport()"></div>
<div class="passport" id="passport"></div>

<div class="po-modal" id="po-modal">
  <div class="po-modal-inner" id="po-modal-inner"></div>
</div>

<div class="fullview" id="fullview">
  <div class="fv-header">
    <button class="fv-back" onclick="closeFullView()">&larr; Back to map</button>
  </div>
  <div class="fv-body" id="fv-body"></div>
</div>

const REGISTRY_BADGE_ROLES = ["importer","exporter","pha","veripura"];

function docVisibility(docName, role){
  if(role==="veripura") return "full";
  const row = DOC_VISIBILITY[docName];
  if(!row) return "full";
  return row[role] || "full";
}

const PORT_COORDS = {
  "Santos": [-23.96, -46.33],
  "Southampton BCP": [50.90, -1.40],

};

const TRACKING_ROLES = ["pha","forwarder"];
const PHA_PRIORITY_DOCS = ["Export Health Certificate (EHC)","CHED-P pre-notification (IPAFFS)"];

function ragColor(rag){
  return rag==="green" ? "#1a6b4a" : rag==="amber" ? "#8a651c" : "#a3311f";
}

function shipPosition(c){
  const from = PORT_COORDS[c.portLoad], to = PORT_COORDS[c.portDischarge];
  if(!from || !to) return null;
  const t = c.transitProgress==null ? 0 : c.transitProgress;
  return [ from[0]+(to[0]-from[0])*t, from[1]+(to[1]-from[1])*t ];
}

function daysToArrival(c){
  if(c.transitProgress>=1) return "Delivered";
  const remaining = Math.round((1-(c.transitProgress||0))*11);
  return remaining<=0 ? "Arriving" : remaining+" day"+(remaining===1?"":"s")+" to "+c.portDischarge;
}

function renderRouteStrip(){
  const lanes = {};
  relevantConsignments().forEach(c=>{
    const key = c.portLoad+" → "+c.portDischarge;
    if(!lanes[key]) lanes[key] = [];
    lanes[key].push(c);
  });
  document.getElementById('route-strip').innerHTML = Object.entries(lanes).map(([lane,cs])=>{
    const rags = cs.map(overallRag);
    const worst = rags.includes("red") ? "red" : rags.includes("amber") ? "amber" : "green";
    return '<div class="route-lane"><span class="rl-dot" style="background:'+ragColor(worst)+'"></span>'
      + '<span class="rl-ports">'+lane+'</span>'
      + '<span class="rl-count">'+cs.length+' consignment'+(cs.length===1?'':'s')+'</span></div>';
  }).join('') || '<div class="route-lane"><span class="rl-ports">No consignments for this view</span></div>';
}

let passportMap = null;
function renderPassportMap(c){
  if(passportMap){ passportMap.remove(); passportMap = null; }
  const from = PORT_COORDS[c.portLoad], to = PORT_COORDS[c.portDischarge];
  if(!from || !to) return;
  passportMap = L.map('passport-map', { zoomControl:false, attributionControl:false, scrollWheelZoom:false, dragging:false, noWrap:true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:19, noWrap:true }).addTo(passportMap);
  const color = ragColor(overallRag(c));
  L.polyline([from,to], {color, weight:2, dashArray:'5 6'}).addTo(passportMap);
  [from,to].forEach(pt=>{
    L.marker(pt, {icon:L.divIcon({className:'', html:'<div class="route-dot" style="background:'+color+'"></div>', iconSize:[12,12], iconAnchor:[6,6]})}).addTo(passportMap);
  });
  passportMap.fitBounds(L.latLngBounds([from,to]).pad(0.4));
}

let trackingMap = null;
function renderTrackingMap(){
  const wrap = document.getElementById('tracking-map-wrap');
  const strip = document.getElementById('route-strip');
  if(!TRACKING_ROLES.includes(currentRole)){
    wrap.style.display = 'none';
    strip.style.display = 'flex';
    return;
  }
  wrap.style.display = 'block';
  strip.style.display = 'none';

  if(trackingMap){ trackingMap.remove(); trackingMap = null; }
  trackingMap = L.map('tracking-map', { zoomControl:true, attributionControl:false, scrollWheelZoom:false, worldCopyJump:false, noWrap:true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:19, noWrap:true }).addTo(trackingMap);

  const list = relevantConsignments();
  const points = [];
  const portsUsed = new Set();
  list.forEach(c=>{ portsUsed.add(c.portLoad); portsUsed.add(c.portDischarge); });
  portsUsed.forEach(port=>{
    const coord = PORT_COORDS[port];
    if(!coord) return;
    L.marker(coord, {icon:L.divIcon({className:'', html:'<div class="port-dot"></div>', iconSize:[9,9], iconAnchor:[5,5]})}).addTo(trackingMap).bindTooltip(port,{direction:'top'});
    points.push(coord);
  });

  list.forEach(c=>{
    const from = PORT_COORDS[c.portLoad], to = PORT_COORDS[c.portDischarge];
    if(!from || !to) return;
    const rag = overallRag(c);
    const color = ragColor(rag);
    L.polyline([from,to], {color, weight:1.5, dashArray:'4 6', opacity:0.6}).addTo(trackingMap);
    const pos = shipPosition(c);
    if(!pos) return;
    points.push(pos);
    const marker = L.marker(pos, {icon:L.divIcon({className:'', html:'<div class="route-dot" style="background:'+color+'"></div>', iconSize:[14,14], iconAnchor:[7,7]})}).addTo(trackingMap);
    marker.bindTooltip('<span class="tip-id">'+c.id+'</span> '+c.commodity+' — '+daysToArrival(c), {direction:'top', offset:[0,-8]});
    marker.on('click', ()=>openFullView(c.id));
  });

  if(points.length){
    trackingMap.fitBounds(L.latLngBounds(points).pad(0.3));
  } else {
    trackingMap.setView([10,-25], 2);
  }
}

let statusFilter = "all";

function setStatusFilter(f){
  statusFilter = f;
  render();
}

function statusBadge(status){
  if(status==="verified") return '<span class="badge b-green">Verified</span>';
  if(status==="pending") return '<span class="badge b-amber">Pending</span>';
  if(status==="awaiting") return '<span class="badge b-gray">Awaiting upload</span>';
  if(status==="flagged") return '<span class="badge b-red">Flagged</span>';
  return '<span class="badge b-gray">'+status+'</span>';
}

function docCompleteness(c){
  const total = c.documents.length;
  const verified = c.documents.filter(d=>d.status==="verified").length;
  const flagged = c.documents.some(d=>d.status==="flagged");
  return {total, verified, flagged};
}

function overallRag(c){
  const {total, verified, flagged} = docCompleteness(c);
  if(flagged) return "red";
  if(verified===total) return "green";
  return "amber";
}

const FILTERABLE_ROLES = ["importer","exporter","forwarder"];

function relevantConsignments(){
  const r = ROLES[currentRole];
  let list = CONSIGNMENTS;
  if(r.filterParty==="importer") list = CONSIGNMENTS.filter(c=>c.importer.startsWith("Emma"));
  // Exporter view: match by exporterId when a consignment carries one (created via the New PO wizard),
  // otherwise fall back to matching on the exporter name for the four seed consignments. This keeps
  // consignments routed to a different/invited exporter out of Felix's view.
  if(r.filterParty==="exporter") list = CONSIGNMENTS.filter(c=> c.exporterId ? c.exporterId==="felix" : c.exporter.startsWith("Felix"));
  if(currentRole==="pha") list = list.filter(c=>c.portDischarge==="Southampton BCP");
  if(FILTERABLE_ROLES.includes(currentRole) && statusFilter!=="all"){
    list = list.filter(c=>overallRag(c)===statusFilter);
  }
  return list;
}

  const r = ROLES[currentRole];
  document.getElementById('role-banner').innerHTML =

function renderItem(c){
  const rag = overallRag(c);
  const badgeClass = rag==="green" ? "b-green" : rag==="amber" ? "b-amber" : "b-red";
  const ragLabel = rag==="green" ? "Verified" : rag==="amber" ? "In progress" : "Flagged";
  const stages = ["Pickup","Loaded, Santos","In transit","GB arrival"];
  const lc = c.lifecycle.map((s,i)=>
    '<div class="lc-step"><span class="lc-dot '+(s==="done"?"done":s==="now"?"now":"")+'"></span><span class="lc-label">'+stages[i]+'</span></div>'
    + (i<3 ? '<div class="lc-line"></div>' : '')
  ).join('');

  let note = "";
  if(currentRole==="exporter") note = c.importer + " &middot; " + c.importerCountry + (ROLES.exporter.readOnlyDest ? ' &middot; GB-side status read-only' : '');
  if(currentRole==="forwarder") note = c.vessel+" "+c.voyage+" &middot; "+c.portLoad+" &rarr; "+c.portDischarge;
  if(currentRole==="customs") { const cds=c.documents.find(d=>d.name.includes("CDS")); note = cds? (cds.status==="verified"?"Cleared":"MRN: "+cds.note) : ""; }
  if(currentRole==="vessel") note = c.voyage+" &middot; ETA "+c.eta;
  if(currentRole==="finance") { const dc=docCompleteness(c); note = dc.verified+" of "+dc.total+" documents verified"; }
  if(currentRole==="pha") note = "ETA "+c.eta+" &middot; commercial value hidden";
  if(currentRole==="importer"||currentRole==="veripura") { const dc=docCompleteness(c); note = dc.verified+" of "+dc.total+" documents verified"; }

  const needsResponse = currentRole==="exporter" && c.poStatus==="awaiting_response";
  const respondBtn = needsResponse
    ? '<button class="respond-btn" onclick="respondToPO(\''+c.id+'\', event)">Respond &mdash; acknowledge and start EHC application</button>'
    : '';
  const badge = needsResponse
    ? '<span class="badge b-red">New — action needed</span>'
    : '<span class="badge '+badgeClass+'">'+ragLabel+'</span>';

  const clickFn = TRACKING_ROLES.includes(currentRole) ? "openFullView" : "openPassport";
  return '<div class="item'+(needsResponse?' needs-response':'')+'" onclick="'+clickFn+'(\''+c.id+'\')">'
    + '<div class="item-top">'
    + '<div><div class="item-title">'+c.commodity+' &middot; '+c.id+'</div><div class="item-sub">'+note+'</div></div>'
    + badge
    + '</div>'
    + respondBtn
    + (ROLES[currentRole].focus==="logistics" || currentRole==="veripura" ? '<div class="lifecycle">'+lc+'</div>' : '')
    + '</div>';
}

function openPassport(id){
  const c = CONSIGNMENTS.find(x=>x.id===id);
  const r = ROLES[currentRole];
  const showCommercial = r.showCommercial;

  let docsHtml = c.documents.map(d=>{
    const vis = docVisibility(d.name, currentRole);
    if(vis==="hidden") return '';
    const isEhc = d.name.includes("EHC") && d.status==="verified";
    const regBadge = (isEhc && REGISTRY_BADGE_ROLES.includes(currentRole)) ? ' <span class="badge b-blue reg-badge">Registry-verified</span>' : '';
    const src = DOC_SOURCE[d.name] ? '<span class="p-doc-source">Source: '+DOC_SOURCE[d.name]+'</span>' : '';
    if(vis==="status"){
      return '<div class="p-doc"><div><div class="p-doc-name">'+d.name+regBadge+'</div><div class="p-doc-sub vis-status-note">Status only &mdash; detail not shared with this role</div>'+src+'</div>'
        + '<div class="p-doc-right">'+statusBadge(d.status)+'</div></div>';
    }
    const link = d.hash ? '<a class="p-doc-link" onclick="event.stopPropagation()">View file</a>' : '';

  }

  if(["importer","exporter","veripura"].includes(currentRole) && isBrazilBeef(c)){

    + c.timeline.map(t=>'<div class="tl-row"><b>'+t.who+'</b> — '+t.what+' <span style="float:right;">'+t.when+'</span></div>').join('')

    '<button class="p-close" onclick="closePassport()">&times;</button>'

    + '<div class="p-note" style="margin-top:0;padding-top:0;border-top:none;">VeriPura\'s full requirements checklist for this consignment, with who is responsible for each document and its current status.</div>'

    + timeline;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('passport').classList.add('open');
  renderPassportMap(c);
}

function openFullView(id){

  let docs = c.documents.filter(d=>docVisibility(d.name, currentRole)!=="hidden");
  if(currentRole==="pha"){
    docs.sort((a,b)=>{
      const ap = PHA_PRIORITY_DOCS.includes(a.name) ? 0 : 1;
      const bp = PHA_PRIORITY_DOCS.includes(b.name) ? 0 : 1;
      return ap-bp;
    });

  const docsHtml = docs.map(d=>{
    const isPriority = currentRole==="pha" && PHA_PRIORITY_DOCS.includes(d.name);
    const vis = docVisibility(d.name, currentRole);
    const isEhc = d.name.includes("EHC") && d.status==="verified";
    const regBadge = (isEhc && REGISTRY_BADGE_ROLES.includes(currentRole)) ? ' <span class="badge b-blue reg-badge">Registry-verified</span>' : '';
    const sub = vis==="status" ? '<span class="vis-status-note">Status only &mdash; detail not shared with this role</span>' : d.note;
    const src = DOC_SOURCE[d.name] ? '<span class="p-doc-source">Source: '+DOC_SOURCE[d.name]+'</span>' : '';
    return '<div class="p-doc"><div><div class="p-doc-name">'+d.name+(isPriority?'<span class="fv-priority-tag">PHA CRITICAL</span>':'')+regBadge+'</div>'
      + '<div class="p-doc-sub">'+sub+'</div>'+src+'</div>'
      + statusBadge(d.status) + '</div>';
  }).join('');

  let origin = "";
  if(currentRole==="pha" && isBrazilBeef(c)){

  }

  document.getElementById('fv-body').innerHTML =
    '<div class="p-ref">'+c.id+' &middot; '+daysToArrival(c)+'</div>'
    + '<div class="p-title">'+c.commodity+'</div>'
    + '<div class="p-route">'+c.portLoad+' &rarr; '+c.portDischarge+' &middot; '+c.vessel+' '+c.voyage+' &middot; ETA '+c.eta+'</div>'
    + '<div style="margin:0.75rem 0;"><span class="badge b-'+(rag==="green"?"green":rag==="amber"?"amber":"red")+'">'+(rag==="green"?"On track":rag==="amber"?"Attention":"Critical")+'</span></div>'
    + '<h2 class="section" style="margin-top:1rem;">Document compliance</h2>'
    + docsHtml
    + origin;

  document.getElementById('fullview').classList.add('open');
}

function closeFullView(){
  document.getElementById('fullview').classList.remove('open');
}

function isBrazilBeef(c){
  return c.portLoad==="Santos" && /beef/i.test(c.commodity);
}

// Renders the origin-verification panel for a consignment. `items` is the (possibly pha-filtered)
// slice of ORIGIN_VALIDATION to show; `c.originFlags` (if present) marks specific items where
// VeriPura's cross-check against Brazilian systems found an inconsistency with what the exporter
// claimed in their shipment documents — those render as Flagged instead of On file, matching the
// same red-flag treatment used elsewhere (e.g. the NL-0089 organic certificate mismatch).
function renderOriginValidation(items, c, opts){
  opts = opts || {};
  const flags = c.originFlags || [];
  const rows = items.map(d=>{
    const flag = flags.find(f=>f.item===d.item);
    const badge = flag ? '<span class="badge b-red">Flagged</span>'
      : !d.available ? '<span class="badge b-gray">Not applicable</span>'
      : '<span class="badge b-green">On file</span>';
    const digitalTag = d.available ? (d.digital ? '<span class="badge b-blue" style="margin-left:0.35rem;">API-integrated</span>' : '<span class="badge b-gray" style="margin-left:0.35rem;">Paper record</span>') : '';
    const subParts = [d.source, d.timeline, d.owner].filter(Boolean).join(' &middot; ');
    const noteHtml = flag ? ' &middot; <b style="color:var(--red);">'+flag.note+'</b>' : (d.note ? ' &middot; '+d.note : '');
    return '<div class="p-doc"><div><div class="p-doc-name">'+d.item+digitalTag+'</div>'
      + '<div class="p-doc-sub">'+subParts+noteHtml+'</div>'
      + '<span class="p-doc-source">'+d.category+'</span></div>'
      + '<div class="p-doc-right">'+badge+'</div></div>';
  }).join('');
  const introText = opts.pha
    ? "Origin food-safety and traceability data relayed to TWIN for Southampton BCP — a subset of what VeriPura validates against Brazilian systems for this consignment."
    : "Independent origin data VeriPura validates against Brazilian government and certification systems for this consignment, alongside the shipment documents above.";
  return '<h2 class="section" style="margin-top:1.25rem;font-size:1.083rem;">Origin verification — Brazil beef corridor</h2>'
    + '<div class="p-note" style="margin-top:0;padding-top:0;border-top:none;">'+introText+'</div>'
    + rows;
}

function submitNewPO(){
  const commodity = poData.commodity || "Frozen boneless beef";
  const qty = poData.qty || "20,000 kg";
  const mode = poData.poMode;
  const id = "BR-GB-0"+poCounter;
  let exporterLabel, timelineNote, poStatus, exporterId;

  if(mode==="invite"){
    const email = poData.inviteEmail || "exporter@example.com";
    exporterLabel = "Invited — "+email;
    timelineNote = "Emma uploaded PO "+id+" and invited "+email+" to VeriPura to respond";
    poStatus = "invited";
    exporterId = null;
  } else {
    const exp = EXPORTERS.find(e=>e.id===poData.exporterId) || EXPORTERS[0];
    exporterLabel = exp.label;
    timelineNote = "Emma uploaded PO "+id+" and directed it to "+exp.label;
    poStatus = "awaiting_response";
    exporterId = exp.id;
  }

  const poDocNote = poData.inputMode==="api" ? "Received via API interface" : "Uploaded by Emma — "+poData.filename;
  const poDoc = {name:"Purchase order / commercial agreement", category:"Customs & logistics", status:"verified", note:poDocNote, hash:"0x"+Math.random().toString(16).slice(2,6)+"…"+Math.random().toString(16).slice(2,6)};

  const newConsignment = {
    id, commodity, hs:"pending",
    exporter: exporterLabel, importer:"Emma — Nordic Frozen Foods Ltd (GB)",
    importerCountry:"United Kingdom", portLoad:"Santos", portDischarge:"Southampton BCP",
    vessel:"pending", voyage:"pending", eta:"to be booked", netWeight:qty,
    container:"pending", seal:"pending", temp:"-18°C frozen",
    lifecycle:["now","pending","pending","pending"], transitProgress:0,
    poStatus, exporterId,
    documents: [poDoc].concat(REQUIRED_DOC_TEMPLATE.filter(d=>!d.name.startsWith("Purchase order")).map(d=>({name:d.name, category:d.category, status:"awaiting", note:"Not yet uploaded", hash:null}))),
    timeline:[ {who:"Importer", what:timelineNote, when:"just now"} ]
  };
  CONSIGNMENTS.unshift(newConsignment);

  if(poStatus==="awaiting_response"){
    ALERTS.unshift({role:"exporter", sev:"info", cid:id, text:"New PO "+id+" from Emma ("+commodity+"). Respond to begin the EHC process."});
  } else {
    ALERTS.unshift({role:"importer", sev:"info", cid:id, text:"Invitation sent for PO "+id+". The exporter will appear once they join VeriPura."});
  }
  ALERTS.unshift({role:"veripura", sev:"info", cid:id, text:"New PO "+id+" created by Emma, "+(poStatus==="invited"?"invitation sent":"sent to "+exporterLabel)+"."});

  closeNewPO();
  render();
}

function respondToPO(id, ev){
  if(ev) ev.stopPropagation();
  const c = CONSIGNMENTS.find(x=>x.id===id);
  c.poStatus = "acknowledged";
  c.timeline.unshift({who:"Exporter", what:"Felix acknowledged PO "+id+" and will begin the EHC application", when:"just now"});
  ALERTS.unshift({role:"importer", sev:"info", cid:id, text:"Felix acknowledged PO "+id+" — EHC application starting."});
  ALERTS.unshift({role:"veripura", sev:"info", cid:id, text:"PO "+id+" acknowledged by exporter. Document checklist now active."});
  render();
}

function relevantAlerts(){
  return currentRole==="veripura" ? ALERTS : ALERTS.filter(a=>a.role===currentRole);
}

function worstSeverity(alerts){
  if(alerts.some(a=>a.sev==="crit")) return "crit";
  if(alerts.some(a=>a.sev==="warn")) return "warn";
  if(alerts.length) return "info";
  return null;
}

function renderBell(){
  const relevant = relevantAlerts();
  const dot = document.getElementById('bell-dot');
  const worst = worstSeverity(relevant);
  dot.style.display = worst ? 'block' : 'none';
  dot.style.background = worst==="crit" ? "var(--red)" : worst==="warn" ? "var(--gold-dim)" : "var(--blue)";
  document.getElementById('bell-panel').innerHTML = relevant.length
    ? relevant.map(a=>'<div class="bell-item" onclick="openPassport(\''+a.cid+'\');toggleBell();"><span class="bell-sev sev-'+a.sev+'">'+a.sev.toUpperCase()+'</span>'+a.text+'</div>').join('')
    : '<div class="bell-item" style="cursor:default;">No alerts for this view.</div>';
}

function toggleBell(){
  document.getElementById('bell-panel').classList.toggle('open');
}

function flashBellIfNeeded(){
  const worst = worstSeverity(relevantAlerts());
  if(worst==="warn" || worst==="crit"){
    const dot = document.getElementById('bell-dot');
    dot.classList.remove('flash');
    void dot.offsetWidth;
    dot.classList.add('flash');
  }
}
flashBellIfNeeded();
setInterval(flashBellIfNeeded, 10000);

document.addEventListener('click', e=>{
  if(!e.target.closest('.bell-wrap')) document.getElementById('bell-panel').classList.remove('open');
});

document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('fullview').classList.contains('open')) closeFullView();
  else if(document.getElementById('passport').classList.contains('open')) closePassport();
  else if(document.getElementById('po-modal').classList.contains('open')) closeNewPO();
});

const sel = document.getElementById('role-select');
sel.innerHTML = Object.entries(ROLES).map(([k,v])=>'<option value="'+k+'">'+v.label+'</option>').join('');
sel.value = currentRole;
render();
</script>
</body>
</html>
